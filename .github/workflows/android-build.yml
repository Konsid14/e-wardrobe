name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www
          cp index.html app.js styles.css www/

      - name: Verify Capacitor project
        run: npx cap doctor

      - name: Create Android project
        run: npx cap add android

      - name: Apply wardrobe launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_wardrobe.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
            <path android:fillColor="#6C63FF" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#FFFFFF" android:strokeColor="#FFFFFF" android:strokeWidth="2" android:strokeLineJoin="round" android:pathData="M35,33c1,-9 9,-16 19,-16s18,7 19,16l17,10c4,2 6,7 4,11l-8,24c-1,4 -5,6 -9,6h-12v16H43V84H31c-4,0 -8,-2 -9,-6L14,54c-2,-4 0,-9 4,-11z"/>
            <path android:fillColor="@android:color/transparent" android:strokeColor="#6C63FF" android:strokeWidth="4" android:strokeLineCap="round" android:pathData="M41,22c2,7 6,11 13,11s11,-4 13,-11"/>
            <path android:fillColor="#6C63FF" android:pathData="M37,61h34v12h-34z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M43,64h22v3h-22z"/>
          </vector>
          EOF
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/ic_wardrobe"#' android/app/src/main/AndroidManifest.xml

      - name: Sync web app with Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
